name: TreinaJunto

options:
  bundleIdPrefix: com.lucasalmeida.treinajunto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  TreinaJunto:
    type: application
    platform: iOS
    sources:
      - path: TreinaJunto
    info:
      path: TreinaJunto/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Unbounded-Regular.ttf
          - Unbounded-Medium.ttf
          - Unbounded-SemiBold.ttf
          - Unbounded-Bold.ttf
          - Unbounded-ExtraBold.ttf
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-SemiBold.ttf
          - PlusJakartaSans-Bold.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasalmeida.treinajunto
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Testes usam @testable import — exige o app compilado como testável.
        ENABLE_TESTABILITY: YES

  TreinaJuntoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TreinaJuntoTests
        excludes:
          - "**/README.md"
          - "**/.gitkeep"
    dependencies:
      - target: TreinaJunto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasalmeida.treinajunto.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TreinaJunto.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TreinaJunto"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TreinaJunto:
    build:
      targets:
        TreinaJunto: all
        TreinaJuntoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - TreinaJunto
      targets:
        - TreinaJuntoTests
    archive:
      config: Release
